name: ci_static_analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".forgejo/workflows/ci_static_analysis.yaml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".forgejo/workflows/ci_static_analysis.yaml"

jobs:
  run_ci_static_analysis:
    name: Run CI Static Analysis
    runs-on: codeberg-tiny

    steps:
      - name: Checkout Project
        uses: actions/checkout@v6

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Environment and Install Dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff Format - Formatting Check
        run: uv run ruff format ./src --check

      - name: Run Ruff - Linting and Import Sorting Check
        if: always()
        run: uv run ruff check ./src

      - name: Run ty - Static Type Checking
        if: always()
        run: uv run ty check ./src

      - name: Run numpydoc Documentation Check
        if: always()
        run: uv run numpydoc lint ./src/**/*.py
